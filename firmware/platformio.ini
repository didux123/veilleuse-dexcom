[platformio]
default_envs = d1_mini

; Flash par cable USB (defaut)
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-FTB6SPL3
monitor_port = /dev/cu.usbserial-FTB6SPL3
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    tzapu/WiFiManager@^2.0.17

; Flash par WiFi (OTA) : pio run -e d1_mini_ota -t upload
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = veilleuse.local
upload_flags = --auth=veilleuse
