[platformio]
default_envs = d1_mini

; Flash par cable USB (defaut)
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
; port serie auto-detecte (il change selon le cable / l'adaptateur USB) ;
; forcer au besoin : pio run -t upload --upload-port /dev/cu.usbserial-XXXX
;
; La page de configuration (web/veilleuse-config.html) est gzippee et
; transformee en include/web_page.h avant chaque compilation.
; ATTENTION : un env enfant qui redefinit extra_scripts ou build_flags
; ECRASE ceux d'ici (extends ne fusionne pas) -> utiliser
; ${env:d1_mini.build_flags} dans l'enfant.
extra_scripts = pre:tools/gen_web.py
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
;   WiFiManager retire en v1.2.0 : portail captif et page de reglages
;   maison (ESP8266WebServer + DNSServer, fournis par le core).

; Flash par WiFi (OTA local). Le hostname est unique par lampe (affiche en
; serie au boot et dans GET /api/diag), donc il se passe en ligne de commande :
;   pio run -e d1_mini_ota -t upload --upload-port veilleuse-xxxxxx.local
; (une adresse IP fonctionne aussi)
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_flags = --auth=veilleuse

; Test de l'auto-update sans toucher a "latest" : pointe un tag de
; prerelease (invisible des lampes en service).
;   gh release create v0.0.0-test firmware.bin version.txt --prerelease
[env:d1_mini_testupd]
extends = env:d1_mini
build_flags =
    -DUPDATE_BASE_URL='"https://github.com/didux123/veilleuse-dexcom/releases/download/v0.0.0-test"'
