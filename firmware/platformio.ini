[platformio]
default_envs = d1_mini

; Flash par cable USB (defaut)
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
; port serie auto-detecte (il change selon le cable / l'adaptateur USB) ;
; forcer au besoin : pio run -t upload --upload-port /dev/cu.usbserial-XXXX
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    tzapu/WiFiManager@^2.0.17

; Flash par WiFi (OTA local). Le hostname est unique par lampe (affiche en
; serie au boot : "[id] ... hostname veilleuse-xxxxxx"), donc il se passe en
; ligne de commande :
;   pio run -e d1_mini_ota -t upload --upload-port veilleuse-xxxxxx.local
; (une adresse IP fonctionne aussi)
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_flags = --auth=veilleuse

; Test de l'auto-update sans toucher a "latest" : pointe un tag de
; prerelease (invisible des lampes en service).
;   gh release create v0.0.0-test firmware.bin version.txt --prerelease
[env:d1_mini_testupd]
extends = env:d1_mini
build_flags =
    -DUPDATE_BASE_URL='"https://github.com/didux123/veilleuse-dexcom/releases/download/v0.0.0-test"'
